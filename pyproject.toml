[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rwm"
version = "0.1.0"
license = {text = "PolyForm-Noncommercial-1.0.0"}
description = "Retail world models: forecasting retail demand under price, promotion, display and feature decisions, on public data."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
trees = ["lightgbm>=4.3"]
deep = ["torch>=2.3"]
fetch = ["kaggle>=1.7.4", "gdown>=5.2", "py7zr>=0.21"]
foundation = ["timesfm[torch,xreg]==3.0.2", "chronos-forecasting==2.3.2",
              "timestral @ git+https://github.com/mistralai/timestral.git@a534bdbd244d64f3d9d743f46c7bf6fc330ed4ff"]
benchmarks = ["neuralforecast==3.3.0", "statsforecast==2.1.1", "hierarchicalforecast==1.5.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
