name: tests
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # the processor-only build of torch, so the model tests run here too and are not skipped
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev,trees,deep]"
      - run: pytest -q
      - run: python -m rwm.experiments.run --config configs/experiments/smoke.yaml
