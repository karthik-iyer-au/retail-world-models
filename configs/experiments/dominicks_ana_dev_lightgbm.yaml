# LightGBM with price, promotion and cost on Dominick's analgesics. The final 8 weeks are held out for the
# final test; this run scores the two 8-week windows before them, overall and
# split by weeks with and without a promotion code.
name: dominicks_ana_dev_lightgbm
seed: 0
dataset:
  name: dominicks
  params: {categories: [ana]}
model:
  name: lightgbm_direct
  params:
    horizon: 8
    train_periods: 156
    categorical: [item_id, store_id]
    extra: [promo, cost]
    lags: [0, 1, 2, 4]
    windows: [4, 8, 13, 26]
    spread_window: 13
    price_window: 12
    price_lag: 1
    rounds: 500
    seed: 0
    threads: 2
    params: {num_leaves: 63, min_data_in_leaf: 50}
evaluation:
  horizon: 8
  n_origins: 2
  holdout_periods: 8
  scale_lag: 1
  weight_window: 13
  conditions: [promo]
