# Check (9 November 2026) that a split run on Vast gives the same forecasts as one run: a short Frat world model.
name: splitcheck_frat_whole
seed: 0
dataset:
  name: breakfast_at_the_frat
model:
  name: seed_average
  params:
    model: state_model
    members: 2
    seed: 0
    params:
      horizon: 8
      history: 26
      train_periods: 90
      categorical:
      - item_id
      - store_id
      - cat_id
      - manufacturer
      - store_segment
      extra:
      - promo
      - display
      - feature
      - tpr_only
      d_model: 64
      layers: 2
      heads: 4
      steps: 300
      batch: 128
      lr: 0.001
      regular_price: true
      lift_readout: true
      rollout: true
      weight_average: 0.999
evaluation:
  horizon: 8
  n_origins: 4
  holdout_periods: 24
  scale_lag: 1
  weight_window: 13
  conditions:
  - promo
  - display
  - feature
  - tpr_only
  step: 8
