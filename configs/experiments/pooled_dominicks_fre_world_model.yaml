# Study U part (b), pooled (plan entry of 11 November 2026); written by scripts/make_pooled_configs.py.
name: pooled_dominicks_fre_world_model
seed: 0
dataset:
  name: dominicks
  params:
    categories:
    - fre
    clean_prices: 5
model:
  name: seed_average
  params:
    model: state_model
    members: 5
    seed: 0
    params:
      horizon: 8
      history: 26
      train_periods: 156
      categorical:
      - item_id
      - store_id
      extra:
      - promo
      - cost
      levers:
      - promo
      d_model: 64
      layers: 2
      heads: 4
      steps: 6000
      batch: 256
      lr: 0.001
      regular_price: true
      lift_readout: true
      rollout: true
      validation_periods: 8
      scale_window: 8
      switching:
      - store_id
      roll_norm: true
      weight_average: 0.999
      total_weight: 0.1
      pretrain_steps: 18000
      finetune: low_lr
      encoder_lr_scale: 0.1
      latent_weight: 0.5
      pretrain_on:
      - name: dominicks
        params:
          categories:
          - ana
          clean_prices: 5
        tag: dominicks_ana
        same_retailer: true
      - name: dominicks
        params:
          categories:
          - bjc
          clean_prices: 5
        tag: dominicks_bjc
        same_retailer: true
      - name: dominicks
        params:
          categories:
          - che
          clean_prices: 5
        tag: dominicks_che
        same_retailer: true
      - name: dominicks
        params:
          categories:
          - sdr
          clean_prices: 5
        tag: dominicks_sdr
        same_retailer: true
      - name: dominicks
        params:
          categories:
          - sna
          clean_prices: 5
        tag: dominicks_sna
        same_retailer: true
      - name: breakfast_at_the_frat
        tag: frat
evaluation:
  horizon: 8
  n_origins: 6
  holdout_periods: 24
  scale_lag: 1
  weight_window: 13
  conditions:
  - promo
  after_promo:
    levers:
    - promo
    periods: 2
  step: 8
