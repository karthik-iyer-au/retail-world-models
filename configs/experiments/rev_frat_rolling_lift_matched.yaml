# Study G (docs/PAPER1_REVISION_PLAN.md, amendment of 17 October 2026): the Frat lift model with the world model's
# regularisation (no readout dropout, default weight decay), so that only the transition differs.
name: rev_frat_rolling_lift_matched
seed: 0
dataset:
  name: breakfast_at_the_frat
model:
  name: state_model
  params:
    horizon: 8
    history: 26
    train_periods: 90
    categorical:
    - item_id
    - store_id
    - cat_id
    - manufacturer
    - store_segment
    extra:
    - promo
    - display
    - feature
    - tpr_only
    d_model: 64
    layers: 2
    heads: 4
    steps: 3000
    batch: 256
    lr: 0.001
    regular_price: true
    lift_readout: true
    seed: 0
evaluation:
  horizon: 8
  n_origins: 4
  holdout_periods: 24
  scale_lag: 1
  weight_window: 13
  conditions:
  - promo
  - display
  - feature
  - tpr_only
  step: 8
