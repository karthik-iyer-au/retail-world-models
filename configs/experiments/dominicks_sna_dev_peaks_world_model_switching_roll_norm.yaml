# Dominick's sna: world model with brand switching and normalisation in the roll-forward (which steadied M5 across seeds).
name: dominicks_sna_dev_peaks_world_model_switching_roll_norm
seed: 0
dataset:
  name: dominicks
  params:
    categories:
    - sna
model:
  name: state_model
  params:
    horizon: 8
    history: 26
    train_periods: 156
    categorical:
    - item_id
    - store_id
    extra:
    - promo
    - cost
    levers:
    - promo
    d_model: 64
    layers: 2
    heads: 4
    steps: 6000
    batch: 512
    lr: 0.001
    regular_price: true
    lift_readout: true
    rollout: true
    validation_periods: 8
    seed: 0
    scale_window: 8
    switching:
    - store_id
    roll_norm: true
evaluation:
  horizon: 8
  n_origins: 2
  holdout_periods: 8
  scale_lag: 1
  weight_window: 13
  conditions:
  - promo
  after_promo:
    levers:
    - promo
    periods: 2
