# 52-week test with settings tuned for 52 weeks (plan entry of 14 November 2026): h52_dominicks_sdr_lightgbm_direct_w0.yaml with the copy's settings from the search h52s2_lightgbm_dominicks_sdr (kept: rounds_double); written by scripts/make_tuned_long_horizon_configs.py.
name: h52t_dominicks_sdr_lightgbm_direct_w0
seed: 0
dataset:
  name: dominicks
  params:
    categories:
    - sdr
    clean_prices: 5
model:
  name: seed_average
  params:
    model: lightgbm_direct
    members: 5
    seed: 0
    params:
      horizon: 52
      train_periods: 156
      categorical:
      - item_id
      - store_id
      extra:
      - promo
      - cost
      lags:
      - 0
      - 1
      - 2
      - 4
      windows:
      - 4
      - 8
      - 13
      - 26
      spread_window: 13
      price_window: 12
      price_lag: 1
      rounds: 1000
      threads: 16
      params:
        num_leaves: 15
        min_data_in_leaf: 50
        max_bin: 255
evaluation:
  horizon: 52
  n_origins: 1
  holdout_periods: 50
  scale_lag: 1
  weight_window: 13
  conditions:
  - promo
  after_promo:
    levers:
    - promo
    periods: 2
