# Final run (plan entry of 10 November 2026): the tuned settings of favorita's lightgbm, from avg5_lightgbm_favorita (kept: avg5_lightgbm_favorita:min_data_in_leaf_4x, avg5_lightgbm_favorita:objective_poisson, avg5_lightgbm_favorita:learning_rate_half), on the paper's rolling windows; written by scripts/make_final_configs.py.
name: final_favorita_lightgbm
seed: 0
dataset:
  name: favorita
model:
  name: seed_average
  params:
    model: lightgbm_direct
    members: 5
    seed: 0
    params:
      horizon: 28
      train_periods: 730
      group_by: store_id
      categorical:
      - item_id
      - class
      - family
      extra:
      - promo
      - event
      - payday
      rounds: 800
      threads: 16
      params:
        min_data_in_leaf: 800
        objective: poisson
        learning_rate: 0.025
evaluation:
  horizon: 28
  n_origins: 4
  scale_lag: 1
  weight_window: 28
  holdout_periods: 0
  step: 28
