# TimesFM 2.5 with the plan: its own covariate method ("xreg + timesfm"), mean output, the plan inputs
# promotion, display, feature, price-reduction-only and price against the highest price in the context window. A comparison added after the final tests.
# Dataset and evaluation copied unchanged from frat_final_timesfm_mean.yaml. Settings fixed before any run.
name: frat_final_timesfm_plan
seed: 0
dataset:
  name: breakfast_at_the_frat
model:
  name: timesfm
  params:
    context: 512
    batch_size: 256
    point: mean
    plan:
    - promo
    - display
    - feature
    - tpr_only
    price_plan: true
    ridge: 1.0
evaluation:
  horizon: 8
  n_origins: 1
  holdout_periods: 0
  scale_lag: 1
  weight_window: 13
  conditions:
  - promo
  - display
  - feature
  - tpr_only
