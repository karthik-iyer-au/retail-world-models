# Study I (plan entry of 27 October 2026): transfer to stores not trained on, from rev_dominicks_sna_rolling_lightgbm; written by scripts/make_transfer_configs.py.
name: transfer_dominicks_sna_store_lightgbm_pooled_trained_on_all
seed: 0
dataset:
  name: dominicks
  params:
    categories:
    - sna
model:
  name: lightgbm_direct
  params:
    horizon: 8
    train_periods: 156
    categorical:
    - item_id
    - store_id
    extra:
    - promo
    - cost
    lags:
    - 0
    - 1
    - 2
    - 4
    windows:
    - 4
    - 8
    - 13
    - 26
    spread_window: 13
    price_window: 12
    price_lag: 1
    rounds: 500
    seed: 0
    threads: 2
    params:
      num_leaves: 63
      min_data_in_leaf: 50
evaluation:
  horizon: 8
  n_origins: 6
  holdout_periods: 24
  scale_lag: 1
  weight_window: 13
  conditions:
  - promo
  after_promo:
    levers:
    - promo
    periods: 2
  step: 8
  transfer:
    by: store_id
    share: 0.2
    seed: 0
    trained_on_all: true
