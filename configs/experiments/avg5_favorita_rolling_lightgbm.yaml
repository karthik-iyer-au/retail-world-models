# Study R (plan entry of 1 November 2026): rev_favorita_rolling_lightgbm as an average of 5 copies; written by scripts/make_research_specs.py.
name: avg5_favorita_rolling_lightgbm
seed: 0
dataset:
  name: favorita
model:
  name: seed_average
  params:
    model: lightgbm_direct
    members: 5
    seed: 0
    params:
      horizon: 28
      train_periods: 730
      group_by: store_id
      categorical:
      - item_id
      - class
      - family
      extra:
      - promo
      - event
      - payday
      rounds: 800
      threads: 16
evaluation:
  horizon: 28
  n_origins: 4
  scale_lag: 1
  weight_window: 28
  holdout_periods: 0
  step: 28
