# Paper 1 revision, the final window, a model not run there before; settings as dominicks_fre's rolling config.
name: rev_dominicks_fre_finalwindow_tft
seed: 0
dataset:
  name: dominicks
  params:
    categories:
    - fre
model:
  name: tft
  params:
    horizon: 8
    input_size: 26
    train_periods: 156
    extra:
    - promo
    max_steps: 1500
evaluation:
  horizon: 8
  n_origins: 1
  holdout_periods: 0
  scale_lag: 1
  weight_window: 13
  conditions:
  - promo
  after_promo:
    levers:
    - promo
    periods: 2
