# Paper 1 revision, rolling windows before the development windows; settings from the companion paper's final config for frat (docs/PAPER1_REVISION_PLAN.md).
name: rev_frat_rolling_lightgbm
seed: 0
dataset:
  name: breakfast_at_the_frat
model:
  name: lightgbm_direct
  params:
    horizon: 8
    train_periods: 90
    categorical:
    - item_id
    - store_id
    - cat_id
    - manufacturer
    - store_segment
    extra:
    - promo
    - display
    - feature
    - tpr_only
    - base_price
    lags:
    - 0
    - 1
    - 2
    - 4
    windows:
    - 4
    - 8
    - 13
    - 26
    spread_window: 13
    price_window: 12
    price_lag: 1
    rounds: 500
    seed: 0
    threads: 2
    params:
      num_leaves: 63
      min_data_in_leaf: 50
evaluation:
  horizon: 8
  n_origins: 4
  holdout_periods: 24
  scale_lag: 1
  weight_window: 13
  conditions:
  - promo
  - display
  - feature
  - tpr_only
  step: 8
