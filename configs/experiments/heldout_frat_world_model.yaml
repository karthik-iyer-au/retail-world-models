# Held-out periods scored (plan entry of 15 November 2026): final_frat_world_model.yaml with only the windows changed; written by scripts/make_heldout_configs.py.
name: heldout_frat_world_model
seed: 0
dataset:
  name: breakfast_at_the_frat
model:
  name: seed_average
  params:
    model: state_model
    members: 5
    seed: 0
    params:
      horizon: 8
      history: 26
      train_periods: 90
      categorical:
      - item_id
      - store_id
      - cat_id
      - manufacturer
      - store_segment
      extra:
      - promo
      - display
      - feature
      - tpr_only
      d_model: 64
      layers: 2
      heads: 4
      steps: 3000
      batch: 128
      lr: 0.001
      regular_price: true
      lift_readout: true
      rollout: true
      weight_average: 0.999
evaluation:
  horizon: 8
  n_origins: 3
  holdout_periods: 0
  scale_lag: 1
  weight_window: 13
  conditions:
  - promo
  - display
  - feature
  - tpr_only
  step: 8
