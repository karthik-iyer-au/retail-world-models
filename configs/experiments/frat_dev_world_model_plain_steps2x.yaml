# Training-length check (change C) on a development window: frat_dev_world_model_plain.yaml unchanged except steps 6000 (twice the original).
# Frat development windows; the final test is not touched. Plan in docs/PAPER_NOTES.md, 'Revised world model: plan', step 4.
name: frat_dev_world_model_plain_steps2x
seed: 0
dataset:
  name: breakfast_at_the_frat
model:
  name: state_model
  params:
    horizon: 8
    history: 26
    train_periods: 90
    categorical:
    - item_id
    - store_id
    - cat_id
    - manufacturer
    - store_segment
    extra:
    - promo
    - display
    - feature
    - tpr_only
    d_model: 64
    layers: 2
    heads: 4
    steps: 6000
    batch: 256
    lr: 0.001
    regular_price: true
    lift_readout: true
    rollout: true
    seed: 0
evaluation:
  horizon: 8
  n_origins: 2
  holdout_periods: 8
  scale_lag: 1
  weight_window: 13
  conditions:
  - promo
  - display
  - feature
  - tpr_only
