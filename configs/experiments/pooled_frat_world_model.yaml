# Study U part (b), pooled (plan entry of 11 November 2026); written by scripts/make_pooled_configs.py.
name: pooled_frat_world_model
seed: 0
dataset:
  name: breakfast_at_the_frat
model:
  name: seed_average
  params:
    model: state_model
    members: 5
    seed: 0
    params:
      horizon: 8
      history: 26
      train_periods: 90
      categorical:
      - item_id
      - store_id
      - cat_id
      - manufacturer
      - store_segment
      extra:
      - promo
      - display
      - feature
      - tpr_only
      d_model: 64
      layers: 2
      heads: 4
      steps: 3000
      batch: 128
      lr: 0.001
      regular_price: true
      lift_readout: true
      rollout: true
      weight_average: 0.999
      pretrain_steps: 9000
      finetune: low_lr
      encoder_lr_scale: 0.1
      latent_weight: 0.5
      pretrain_on:
      - name: dominicks
        params:
          categories:
          - ana
          clean_prices: 5
        tag: dominicks_ana
      - name: dominicks
        params:
          categories:
          - bjc
          clean_prices: 5
        tag: dominicks_bjc
      - name: dominicks
        params:
          categories:
          - che
          clean_prices: 5
        tag: dominicks_che
      - name: dominicks
        params:
          categories:
          - fre
          clean_prices: 5
        tag: dominicks_fre
      - name: dominicks
        params:
          categories:
          - sdr
          clean_prices: 5
        tag: dominicks_sdr
      - name: dominicks
        params:
          categories:
          - sna
          clean_prices: 5
        tag: dominicks_sna
evaluation:
  horizon: 8
  n_origins: 4
  holdout_periods: 24
  scale_lag: 1
  weight_window: 13
  conditions:
  - promo
  - display
  - feature
  - tpr_only
  step: 8
