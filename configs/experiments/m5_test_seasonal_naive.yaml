# Seasonal naive on the official M5 test period (29 May to 19 June 2016),
# scored with the 12-level WRMSSE. The organisers publish 0.847 for this method.
name: m5_test_seasonal_naive
seed: 0
dataset:
  name: m5
  params: {include_test: true}
model:
  name: seasonal_naive
  params: {season: 7}
evaluation:
  horizon: 28
  n_origins: 1
  scale_lag: 1
  weight_window: 28
