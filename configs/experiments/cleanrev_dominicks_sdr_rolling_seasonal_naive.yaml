# Dominick's comparison of all models rerun on cleaned prices (plan entry of 10 November 2026): rev_dominicks_sdr_rolling_seasonal_naive.yaml with clean_prices 5; written by hand from the rev configs.
name: cleanrev_dominicks_sdr_rolling_seasonal_naive
seed: 0
dataset:
  name: dominicks
  params:
    categories:
    - sdr
    clean_prices: 5
model:
  name: seasonal_naive
  params:
    season: 52
evaluation:
  horizon: 8
  n_origins: 6
  holdout_periods: 24
  scale_lag: 1
  weight_window: 13
  conditions:
  - promo
  after_promo:
    levers:
    - promo
    periods: 2
  step: 8
