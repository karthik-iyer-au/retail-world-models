# The lift model with the held-price rule, the US seasonal calendar and promotion crowding.
# Dominick's analgesics development windows.
name: dominicks_ana_dev_state_model_lift_merchant_inputs
seed: 0
dataset:
  name: dominicks
  params:
    categories: [ana]
  calendar: {country: US, anchor: start}
  crowding:
    levers: [promo]
model:
  name: state_model
  params:
    horizon: 8
    history: 26
    train_periods: 156
    categorical: [item_id, store_id]
    extra: [promo, cost, ev_new_year, pre_new_year, ev_super_bowl, pre_super_bowl, ev_valentines, pre_valentines,
      ev_easter, pre_easter, ev_mothers_day, pre_mothers_day, ev_memorial_day, pre_memorial_day, ev_july_4,
      pre_july_4, ev_labor_day, pre_labor_day, ev_halloween, pre_halloween, ev_thanksgiving, pre_thanksgiving,
      ev_christmas, pre_christmas, promo_share]
    levers: [promo]
    d_model: 64
    layers: 2
    heads: 4
    steps: 6000
    batch: 512
    lr: 0.001
    regular_price: true
    lift_readout: true
    regular_hold: 4
    seed: 0
evaluation:
  horizon: 8
  n_origins: 2
  holdout_periods: 8
  scale_lag: 1
  weight_window: 13
  conditions: [promo]
