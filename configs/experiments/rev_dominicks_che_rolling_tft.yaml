# Paper 1 revision, rolling windows before the development windows; settings from the companion paper's final config for dominicks_che (docs/PAPER1_REVISION_PLAN.md).
name: rev_dominicks_che_rolling_tft
seed: 0
dataset:
  name: dominicks
  params:
    categories:
    - che
model:
  name: tft
  params:
    horizon: 8
    input_size: 26
    train_periods: 156
    extra:
    - promo
    max_steps: 1500
evaluation:
  horizon: 8
  n_origins: 6
  holdout_periods: 24
  scale_lag: 1
  weight_window: 13
  conditions:
  - promo
  after_promo:
    levers:
    - promo
    periods: 2
  step: 8
