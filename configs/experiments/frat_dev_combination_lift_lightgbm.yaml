# A weighted average of our lift model and LightGBM, weights chosen on the
# last 8 training weeks. Breakfast at the Frat development windows.
name: frat_dev_combination_lift_lightgbm
seed: 0
dataset: {name: breakfast_at_the_frat}
model:
  name: combination
  params:
    validation_periods: 8
    seed: 0
    models:
    - name: state_model
      params:
        horizon: 8
        history: 26
        train_periods: 90
        categorical: [item_id, store_id, cat_id, manufacturer, store_segment]
        extra: [promo, display, feature, tpr_only]
        d_model: 64
        layers: 2
        heads: 4
        steps: 3000
        batch: 256
        lr: 0.001
        regular_price: true
        lift_readout: true
    - name: lightgbm_direct
      params:
        horizon: 8
        train_periods: 90
        categorical: [item_id, store_id, cat_id, manufacturer, store_segment]
        extra: [promo, display, feature, tpr_only, base_price]
        lags: [0, 1, 2, 4]
        windows: [4, 8, 13, 26]
        spread_window: 13
        price_window: 12
        price_lag: 1
        rounds: 500
        threads: 2
        params: {num_leaves: 63, min_data_in_leaf: 50}
evaluation:
  horizon: 8
  n_origins: 2
  holdout_periods: 8
  scale_lag: 1
  weight_window: 13
  conditions: [promo, display, feature, tpr_only]
