# NUC check: the exact config of the Vast test of 2 November 2026 (vast_test/..._3cb5db75), the cheese
# starting run of study O at seed 1, single copy, to compare the NUC's RTX 5090 with Vast and Modal.
name: research_pure_dominicks_che_start_s1_seed1
seed: 1
dataset:
  name: dominicks
  params:
    categories:
    - che
model:
  name: state_model
  params:
    horizon: 8
    history: 26
    train_periods: 156
    categorical:
    - item_id
    - store_id
    extra:
    - promo
    - cost
    levers:
    - promo
    d_model: 64
    layers: 2
    heads: 4
    steps: 6000
    batch: 512
    lr: 0.001
    regular_price: true
    lift_readout: true
    rollout: true
    validation_periods: 8
    scale_window: 8
    switching:
    - store_id
    roll_norm: true
    seed: 1
evaluation:
  horizon: 8
  n_origins: 4
  holdout_periods: 72
  step: 8
  scale_lag: 1
  weight_window: 13
  after_promo:
    levers:
    - promo
    periods: 2
