# Study D (plan amendment of 15 October 2026): lightgbm on Favorita, settings of rev_m5_rolling_lightgbm; written by scripts/make_favorita_configs.py.
name: rev_favorita_rolling_lightgbm
seed: 0
dataset:
  name: favorita
model:
  name: lightgbm_direct
  params:
    horizon: 28
    train_periods: 730
    group_by: store_id
    categorical:
    - item_id
    - class
    - family
    extra:
    - promo
    - event
    - payday
    rounds: 800
    seed: 0
    threads: 2
evaluation:
  horizon: 28
  n_origins: 4
  scale_lag: 1
  weight_window: 28
  holdout_periods: 0
  step: 28
