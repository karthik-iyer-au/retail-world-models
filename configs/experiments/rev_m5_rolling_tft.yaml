# Temporal Fusion Transformer on M5 (added 14 November 2026): paper 1 said its cost was beyond the compute available, which was never measured; this runs it, with Dominick's settings scaled to M5's daily periods (input 112 days and 730 days of training, as the world model).
name: rev_m5_rolling_tft
seed: 0
dataset:
  name: m5
model:
  name: tft
  params:
    horizon: 28
    input_size: 112
    train_periods: 730
    extra:
    - event
    - snap
    max_steps: 1500
evaluation:
  horizon: 28
  n_origins: 4
  scale_lag: 1
  weight_window: 28
  holdout_periods: 84
  step: 28
