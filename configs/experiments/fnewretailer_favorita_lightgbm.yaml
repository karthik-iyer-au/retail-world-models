# New retailer, settings carried over (plan entry of 10 November 2026): avg5_favorita_rolling_lightgbm with every setting of final_m5_lightgbm except the column lists; written by scripts/make_final_transfer_configs.py.
name: fnewretailer_favorita_lightgbm
seed: 0
dataset:
  name: favorita
model:
  name: seed_average
  params:
    model: lightgbm_direct
    members: 5
    seed: 0
    params:
      horizon: 28
      train_periods: 730
      group_by: store_id
      rounds: 800
      threads: 16
      params:
        num_leaves: 63
      categorical:
      - item_id
      - class
      - family
      extra:
      - promo
      - event
      - payday
evaluation:
  horizon: 28
  n_origins: 4
  scale_lag: 1
  weight_window: 28
  holdout_periods: 0
  step: 28
