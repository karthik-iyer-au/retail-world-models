# LightGBM with all recorded levers on the Breakfast at the Frat development
# windows, as the average of five fits with different seeds.
name: frat_dev_lightgbm_seed_average
seed: 0
dataset: {name: breakfast_at_the_frat}
model:
  name: seed_average
  params:
    model: lightgbm_direct
    members: 5
    seed: 0
    params:
      horizon: 8
      train_periods: 90
      categorical: [item_id, store_id, cat_id, manufacturer, store_segment]
      extra: [promo, display, feature, tpr_only, base_price]
      lags: [0, 1, 2, 4]
      windows: [4, 8, 13, 26]
      spread_window: 13
      price_window: 12
      price_lag: 1
      rounds: 500
      threads: 2
      params: {num_leaves: 63, min_data_in_leaf: 50}
evaluation:
  horizon: 8
  n_origins: 2
  holdout_periods: 8
  scale_lag: 1
  weight_window: 13
  conditions: [promo, display, feature, tpr_only]
