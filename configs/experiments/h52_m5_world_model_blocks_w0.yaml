# 52-week test (plan entry of 13 November 2026): final_m5_world_model.yaml with only the distance ahead changed (blocks, window 0); written by scripts/make_long_horizon_configs.py.
name: h52_m5_world_model_blocks_w0
seed: 0
dataset:
  name: m5
model:
  name: blocks
  params:
    model: state_model
    block: 91
    params:
      horizon: 91
      history: 112
      train_periods: 730
      categorical:
      - item_id
      - dept_id
      - cat_id
      - store_id
      - state_id
      extra:
      - event
      - snap
      d_model: 128
      layers: 3
      heads: 4
      steps: 30000
      batch: 1024
      lr: 0.001
      seed: 0
      mixed_precision: true
      regular_price: true
      lift_readout: true
      rollout: true
      roll_norm: true
      feedback: true
      likelihood: hurdle_nb
      spread_by_item: true
evaluation:
  horizon: 364
  n_origins: 1
  scale_lag: 1
  weight_window: 28
  holdout_periods: 266
