# Final test: Breakfast at the Frat, the last 8 weeks, LightGBM with all recorded levers. Settings copied unchanged from the development config frat_dev_lightgbm.yaml;
# fixed before the run and not tuned on this window. Reported once.
name: frat_final_lightgbm
seed: 0
dataset:
  name: breakfast_at_the_frat
model:
  name: lightgbm_direct
  params:
    horizon: 8
    train_periods: 90
    categorical:
    - item_id
    - store_id
    - cat_id
    - manufacturer
    - store_segment
    extra:
    - promo
    - display
    - feature
    - tpr_only
    - base_price
    lags:
    - 0
    - 1
    - 2
    - 4
    windows:
    - 4
    - 8
    - 13
    - 26
    spread_window: 13
    price_window: 12
    price_lag: 1
    rounds: 500
    seed: 0
    threads: 2
    params:
      num_leaves: 63
      min_data_in_leaf: 50
evaluation:
  horizon: 8
  n_origins: 1
  holdout_periods: 0
  scale_lag: 1
  weight_window: 13
  conditions:
  - promo
  - display
  - feature
  - tpr_only
