# Final run (plan entry of 10 November 2026): the tuned settings of m5's lightgbm, from pure_lightgbm_m5 (kept: pure_lightgbm_m5:num_leaves_quarter), on the paper's rolling windows; written by scripts/make_final_configs.py.
name: final_m5_lightgbm
seed: 0
dataset:
  name: m5
model:
  name: lightgbm_direct
  params:
    horizon: 28
    train_periods: 730
    group_by: store_id
    categorical:
    - item_id
    - dept_id
    - cat_id
    extra:
    - event
    - snap
    rounds: 800
    seed: 0
    threads: 16
    params:
      num_leaves: 63
evaluation:
  horizon: 28
  n_origins: 4
  scale_lag: 1
  weight_window: 28
  holdout_periods: 84
  step: 28
