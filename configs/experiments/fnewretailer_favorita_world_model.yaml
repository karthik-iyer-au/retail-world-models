# New retailer, settings carried over (plan entry of 10 November 2026): avg5_favorita_rolling_world_model with every setting of final_m5_world_model except the column lists; written by scripts/make_final_transfer_configs.py.
name: fnewretailer_favorita_world_model
seed: 0
dataset:
  name: favorita
model:
  name: seed_average
  params:
    model: state_model
    members: 5
    seed: 0
    params:
      horizon: 28
      history: 112
      train_periods: 730
      d_model: 128
      layers: 3
      heads: 4
      steps: 30000
      batch: 1024
      lr: 0.001
      mixed_precision: true
      regular_price: true
      lift_readout: true
      rollout: true
      roll_norm: true
      feedback: true
      likelihood: hurdle_nb
      spread_by_item: true
      categorical:
      - item_id
      - class
      - family
      - store_id
      - city
      extra:
      - promo
      - event
      - payday
      levers:
      - promo
evaluation:
  horizon: 28
  n_origins: 4
  scale_lag: 1
  weight_window: 28
  holdout_periods: 0
  step: 28
