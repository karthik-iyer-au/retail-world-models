# Held-out periods scored (plan entry of 15 November 2026): final_m5_lightgbm.yaml with only the windows changed; written by scripts/make_heldout_configs.py.
name: heldout_m5_lightgbm
seed: 0
dataset:
  name: m5
  params:
    include_test: true
model:
  name: lightgbm_direct
  params:
    horizon: 28
    train_periods: 730
    group_by: store_id
    categorical:
    - item_id
    - dept_id
    - cat_id
    extra:
    - event
    - snap
    rounds: 800
    seed: 0
    threads: 16
    params:
      num_leaves: 63
evaluation:
  horizon: 28
  n_origins: 4
  scale_lag: 1
  weight_window: 28
  holdout_periods: 0
  step: 28
