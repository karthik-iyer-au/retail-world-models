# Study U part (b), pooled (plan entry of 11 November 2026); written by scripts/make_pooled_configs.py.
name: pooled_favorita_lightgbm
seed: 0
dataset:
  name: favorita
model:
  name: seed_average
  params:
    model: pooled
    members: 5
    seed: 0
    params:
      model: lightgbm_direct
      params:
        horizon: 28
        train_periods: 730
        group_by: store_id
        categorical:
        - item_id
        - class
        - family
        extra:
        - promo
        - event
        - payday
        rounds: 800
        threads: 16
        params:
          min_data_in_leaf: 800
          objective: poisson
          learning_rate: 0.025
      pool_with:
      - name: m5
        tag: m5
evaluation:
  horizon: 28
  n_origins: 4
  scale_lag: 1
  weight_window: 28
  holdout_periods: 0
  step: 28
