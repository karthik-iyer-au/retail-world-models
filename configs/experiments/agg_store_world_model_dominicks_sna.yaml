# Study P (docs/PAPER1_REVISION_PLAN.md, entry of 1 November 2026): store totals forecast directly,
# settings of configs/experiments/avg5_dominicks_sna_rolling_world_model.yaml as its study O loop starts it; written by scripts/make_reconcile_configs.py.
name: agg_store_world_model_dominicks_sna
seed: 0
dataset:
  name: dominicks
  params:
    categories:
    - sna
  aggregate:
    by:
    - store_id
model:
  name: seed_average
  params:
    model: state_model
    members: 5
    seed: 0
    params:
      horizon: 8
      history: 26
      train_periods: 156
      categorical:
      - item_id
      - store_id
      extra:
      - promo
      - cost
      levers:
      - promo
      d_model: 64
      layers: 2
      heads: 4
      steps: 6000
      batch: 512
      lr: 0.001
      regular_price: true
      lift_readout: true
      rollout: true
      validation_periods: 8
      scale_window: 8
      switching:
      - store_id
      roll_norm: true
      weight_average: 0.999
evaluation:
  horizon: 8
  n_origins: 4
  holdout_periods: 72
  step: 8
  scale_lag: 1
  weight_window: 13
  after_promo:
    levers:
    - promo
    periods: 2
