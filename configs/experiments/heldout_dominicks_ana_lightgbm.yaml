# Held-out periods scored (plan entry of 15 November 2026): final_dominicks_ana_lightgbm.yaml with only the windows changed; written by scripts/make_heldout_configs.py.
name: heldout_dominicks_ana_lightgbm
seed: 0
dataset:
  name: dominicks
  params:
    categories:
    - ana
    clean_prices: 5
model:
  name: seed_average
  params:
    model: lightgbm_direct
    members: 5
    seed: 0
    params:
      horizon: 8
      train_periods: 156
      categorical:
      - item_id
      - store_id
      extra:
      - promo
      - cost
      lags:
      - 0
      - 1
      - 2
      - 4
      windows:
      - 4
      - 8
      - 13
      - 26
      spread_window: 13
      price_window: 12
      price_lag: 1
      rounds: 500
      threads: 16
      params:
        num_leaves: 15
        min_data_in_leaf: 50
evaluation:
  horizon: 8
  n_origins: 3
  holdout_periods: 0
  scale_lag: 1
  weight_window: 13
  conditions:
  - promo
  after_promo:
    levers:
    - promo
    periods: 2
  step: 8
