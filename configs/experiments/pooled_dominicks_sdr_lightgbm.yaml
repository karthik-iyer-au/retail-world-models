# Study U part (b), pooled (plan entry of 11 November 2026); written by scripts/make_pooled_configs.py.
name: pooled_dominicks_sdr_lightgbm
seed: 0
dataset:
  name: dominicks
  params:
    categories:
    - sdr
    clean_prices: 5
model:
  name: seed_average
  params:
    model: pooled
    members: 5
    seed: 0
    params:
      model: lightgbm_direct
      params:
        horizon: 8
        train_periods: 156
        categorical:
        - item_id
        - store_id
        extra:
        - promo
        - cost
        lags:
        - 0
        - 1
        - 2
        - 4
        windows:
        - 4
        - 8
        - 13
        - 26
        spread_window: 13
        price_window: 12
        price_lag: 1
        rounds: 500
        threads: 16
        params:
          num_leaves: 15
          min_data_in_leaf: 50
          max_bin: 255
      pool_with:
      - name: dominicks
        params:
          categories:
          - ana
          clean_prices: 5
        tag: dominicks_ana
        same_retailer: true
      - name: dominicks
        params:
          categories:
          - bjc
          clean_prices: 5
        tag: dominicks_bjc
        same_retailer: true
      - name: dominicks
        params:
          categories:
          - che
          clean_prices: 5
        tag: dominicks_che
        same_retailer: true
      - name: dominicks
        params:
          categories:
          - fre
          clean_prices: 5
        tag: dominicks_fre
        same_retailer: true
      - name: dominicks
        params:
          categories:
          - sna
          clean_prices: 5
        tag: dominicks_sna
        same_retailer: true
      - name: breakfast_at_the_frat
        tag: frat
evaluation:
  horizon: 8
  n_origins: 6
  holdout_periods: 24
  scale_lag: 1
  weight_window: 13
  conditions:
  - promo
  after_promo:
    levers:
    - promo
    periods: 2
  step: 8
