# Pantry-loading study (plan amendment of 15 October 2026): lift_lags on the development windows of dominicks_sna; written by scripts/make_pantry_configs.py.
name: dominicks_sna_dev_pantry_lift_lags
seed: 0
dataset:
  name: dominicks
  params:
    categories:
    - sna
model:
  name: state_model
  params:
    horizon: 8
    history: 26
    train_periods: 156
    categorical:
    - item_id
    - store_id
    extra:
    - promo
    - cost
    levers:
    - promo
    d_model: 64
    layers: 2
    heads: 4
    steps: 6000
    batch: 512
    lr: 0.001
    regular_price: true
    lift_readout: true
    validation_periods: 8
    scale_window: 8
    switching:
    - store_id
    plan_lags: 2
evaluation:
  horizon: 8
  n_origins: 2
  holdout_periods: 8
  scale_lag: 1
  weight_window: 13
  conditions:
  - promo
  after_promo:
    levers:
    - promo
    periods: 2
