# History-length test (plan entry of 15 November 2026): final_m5_lightgbm.yaml with only the training length changed to 1460 periods; written by scripts/make_history_configs.py.
name: hist_m5_lightgbm_4y
seed: 0
dataset:
  name: m5
model:
  name: lightgbm_direct
  params:
    horizon: 28
    train_periods: 1460
    group_by: store_id
    categorical:
    - item_id
    - dept_id
    - cat_id
    extra:
    - event
    - snap
    rounds: 800
    seed: 0
    threads: 16
    params:
      num_leaves: 63
evaluation:
  horizon: 28
  n_origins: 4
  scale_lag: 1
  weight_window: 28
  holdout_periods: 84
  step: 28
