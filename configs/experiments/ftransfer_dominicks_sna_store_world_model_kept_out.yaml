# Transfer rerun (plan entry of 10 November 2026) from final_dominicks_sna_world_model; written by scripts/make_final_transfer_configs.py.
name: ftransfer_dominicks_sna_store_world_model_kept_out
seed: 0
dataset:
  name: dominicks
  params:
    categories:
    - sna
    clean_prices: 5
model:
  name: seed_average
  params:
    model: state_model
    members: 5
    seed: 0
    params:
      horizon: 8
      history: 26
      train_periods: 156
      categorical:
      - item_id
      - store_id
      extra:
      - promo
      - cost
      levers:
      - promo
      d_model: 64
      layers: 2
      heads: 4
      steps: 6000
      batch: 512
      lr: 0.001
      regular_price: true
      lift_readout: true
      rollout: true
      validation_periods: 8
      scale_window: 8
      switching:
      - store_id
      roll_norm: true
      weight_average: 0.999
      likelihood: negative_binomial
      spread_by_item: true
      finetune: low_lr
      encoder_lr_scale: 0.1
      latent_weight: 0.5
      pretrain_steps: 18000
evaluation:
  horizon: 8
  n_origins: 6
  holdout_periods: 24
  scale_lag: 1
  weight_window: 13
  conditions:
  - promo
  after_promo:
    levers:
    - promo
    periods: 2
  step: 8
  transfer:
    by: store_id
    share: 0.2
    seed: 0
    trained_on_all: false
