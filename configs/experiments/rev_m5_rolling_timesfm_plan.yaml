# Paper 1 revision, rolling windows before the development windows; settings from the companion paper's final config for m5 (docs/PAPER1_REVISION_PLAN.md).
name: rev_m5_rolling_timesfm_plan
seed: 0
dataset:
  name: m5
model:
  name: timesfm
  params:
    context: 512
    batch_size: 256
    point: mean
    plan:
    - event
    - snap
    price_plan: true
    ridge: 1.0
    chunk: 2048
evaluation:
  horizon: 28
  n_origins: 4
  scale_lag: 1
  weight_window: 28
  holdout_periods: 84
  step: 28
