# Unusual-plan test: lever mixes this item had in under 2% of its training rows.
name: frat_dev_rare_for_item_world_model
seed: 0
dataset:
  name: breakfast_at_the_frat
model:
  name: state_model
  params:
    horizon: 8
    history: 26
    train_periods: 90
    categorical:
    - item_id
    - store_id
    - cat_id
    - manufacturer
    - store_segment
    extra:
    - promo
    - display
    - feature
    - tpr_only
    d_model: 64
    layers: 2
    heads: 4
    steps: 3000
    batch: 256
    lr: 0.001
    regular_price: true
    lift_readout: true
    rollout: true
    seed: 0
evaluation:
  horizon: 8
  n_origins: 2
  holdout_periods: 8
  scale_lag: 1
  weight_window: 13
  conditions:
  - promo
  - display
  - feature
  - tpr_only
  rare_plans:
    levers:
    - display
    - feature
    - tpr_only
    below: 0.02
    by: item_id
