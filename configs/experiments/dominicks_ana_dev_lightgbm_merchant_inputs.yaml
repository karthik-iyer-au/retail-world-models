# LightGBM with the same US seasonal calendar and promotion crowding columns as our model.
# Dominick's analgesics development windows.
name: dominicks_ana_dev_lightgbm_merchant_inputs
seed: 0
dataset:
  name: dominicks
  params:
    categories: [ana]
  calendar: {country: US, anchor: start}
  crowding:
    levers: [promo]
model:
  name: lightgbm_direct
  params:
    horizon: 8
    train_periods: 156
    categorical: [item_id, store_id]
    extra: [promo, cost, ev_new_year, pre_new_year, ev_super_bowl, pre_super_bowl, ev_valentines, pre_valentines,
      ev_easter, pre_easter, ev_mothers_day, pre_mothers_day, ev_memorial_day, pre_memorial_day, ev_july_4,
      pre_july_4, ev_labor_day, pre_labor_day, ev_halloween, pre_halloween, ev_thanksgiving, pre_thanksgiving,
      ev_christmas, pre_christmas, promo_share]
    lags: [0, 1, 2, 4]
    windows: [4, 8, 13, 26]
    spread_window: 13
    price_window: 12
    price_lag: 1
    rounds: 500
    seed: 0
    threads: 2
    params: {num_leaves: 63, min_data_in_leaf: 50}
evaluation:
  horizon: 8
  n_origins: 2
  holdout_periods: 8
  scale_lag: 1
  weight_window: 13
  conditions: [promo]
