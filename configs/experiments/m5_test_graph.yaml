# Graph model on the official M5 test period (23 May to 19 June 2016).
# Graph model over product attributes (same item in other stores; same department in the same store), one round of
# GraphSAGE-style message passing. Inputs, dataset and evaluation copied from m5_test_lightgbm.yaml. Settings fixed before any run.
name: m5_test_graph
seed: 0
dataset:
  name: m5
  params:
    include_test: true
model:
  name: graph_direct
  params:
    horizon: 28
    train_periods: 730
    relations:
    - - item_id
    - - store_id
      - dept_id
    categorical:
    - item_id
    - dept_id
    - cat_id
    extra:
    - event
    - snap
    hidden: 128
    steps: 6000
    lr: 0.001
    seed: 0
evaluation:
  horizon: 28
  n_origins: 1
  scale_lag: 1
  weight_window: 28
