# Paper 1 revision, the final window, a model not run there before; settings as frat's rolling config.
name: rev_frat_finalwindow_tft
seed: 0
dataset:
  name: breakfast_at_the_frat
model:
  name: tft
  params:
    horizon: 8
    input_size: 26
    train_periods: 90
    extra:
    - promo
    - display
    - feature
    - tpr_only
    max_steps: 1500
evaluation:
  horizon: 8
  n_origins: 1
  holdout_periods: 0
  scale_lag: 1
  weight_window: 13
  conditions:
  - promo
  - display
  - feature
  - tpr_only
