# LightGBM with all recorded levers on Breakfast at the Frat: three 8-week windows at the end of the data.
# Price, display, circular and price-cut flags for the forecast weeks are taken
# as planned in advance, which is how a merchant would use the forecast.
name: frat_lightgbm
seed: 0
dataset:
  name: breakfast_at_the_frat
model:
  name: lightgbm_direct
  params:
    horizon: 8
    train_periods: 90
    categorical: [item_id, store_id, cat_id, manufacturer, store_segment]
    extra: [promo, display, feature, tpr_only, base_price]
    lags: [0, 1, 2, 4]
    windows: [4, 8, 13, 26]
    spread_window: 13
    price_window: 12
    price_lag: 1
    rounds: 500
    seed: 0
    threads: 2
    params: {num_leaves: 63, min_data_in_leaf: 50}
evaluation:
  horizon: 8
  n_origins: 3
  scale_lag: 1
  weight_window: 13
  conditions: [promo, display, feature, tpr_only]
