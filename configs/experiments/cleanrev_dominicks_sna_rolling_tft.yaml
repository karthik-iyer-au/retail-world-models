# Dominick's comparison of all models rerun on cleaned prices (plan entry of 10 November 2026): rev_dominicks_sna_rolling_tft.yaml with clean_prices 5; written by hand from the rev configs.
name: cleanrev_dominicks_sna_rolling_tft
seed: 0
dataset:
  name: dominicks
  params:
    categories:
    - sna
    clean_prices: 5
model:
  name: tft
  params:
    horizon: 8
    input_size: 26
    train_periods: 156
    extra:
    - promo
    max_steps: 1500
evaluation:
  horizon: 8
  n_origins: 6
  holdout_periods: 24
  scale_lag: 1
  weight_window: 13
  conditions:
  - promo
  after_promo:
    levers:
    - promo
    periods: 2
  step: 8
