# As frat_dev_state_model_lift, but the model reads a full year of history (52
# weeks instead of 26) so it sees more of each item's past promotions.
name: frat_dev_state_model_lift_long_history
seed: 0
dataset:
  name: breakfast_at_the_frat
model:
  name: state_model
  params:
    horizon: 8
    history: 52
    train_periods: 80
    categorical: [item_id, store_id, cat_id, manufacturer, store_segment]
    extra: [promo, display, feature, tpr_only]
    d_model: 64
    layers: 2
    heads: 4
    steps: 3000
    batch: 256
    lr: 0.001
    regular_price: true
    lift_readout: true
    seed: 0
evaluation:
  horizon: 8
  n_origins: 2
  holdout_periods: 8
  scale_lag: 1
  weight_window: 13
  conditions: [promo, display, feature, tpr_only]
