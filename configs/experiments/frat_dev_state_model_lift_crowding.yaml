# The lift model with how crowded the circular, displays and price cuts are in the store that week.
# Breakfast at the Frat development windows.
name: frat_dev_state_model_lift_crowding
seed: 0
dataset:
  name: breakfast_at_the_frat
  crowding:
    levers: [display, feature, tpr_only]
    within: cat_id
model:
  name: state_model
  params:
    horizon: 8
    history: 26
    train_periods: 90
    categorical: [item_id, store_id, cat_id, manufacturer, store_segment]
    extra: [promo, display, feature, tpr_only, display_share, feature_share, tpr_only_share, display_share_within,
      feature_share_within, tpr_only_share_within]
    d_model: 64
    layers: 2
    heads: 4
    steps: 3000
    batch: 256
    lr: 0.001
    regular_price: true
    lift_readout: true
    levers: [promo, display, feature, tpr_only]
    seed: 0
evaluation:
  horizon: 8
  n_origins: 2
  holdout_periods: 8
  scale_lag: 1
  weight_window: 13
  conditions: [promo, display, feature, tpr_only]
