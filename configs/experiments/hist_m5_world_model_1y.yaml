# History-length test (plan entry of 15 November 2026): final_m5_world_model.yaml with only the training length changed to 365 periods; written by scripts/make_history_configs.py.
name: hist_m5_world_model_1y
seed: 0
dataset:
  name: m5
model:
  name: state_model
  params:
    horizon: 28
    history: 112
    train_periods: 365
    categorical:
    - item_id
    - dept_id
    - cat_id
    - store_id
    - state_id
    extra:
    - event
    - snap
    d_model: 128
    layers: 3
    heads: 4
    steps: 30000
    batch: 1024
    lr: 0.001
    seed: 0
    mixed_precision: true
    regular_price: true
    lift_readout: true
    rollout: true
    roll_norm: true
    feedback: true
    likelihood: hurdle_nb
    spread_by_item: true
evaluation:
  horizon: 28
  n_origins: 4
  scale_lag: 1
  weight_window: 28
  holdout_periods: 84
  step: 28
