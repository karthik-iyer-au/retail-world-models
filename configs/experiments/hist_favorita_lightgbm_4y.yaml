# History-length test (plan entry of 15 November 2026): final_favorita_lightgbm.yaml with only the training length changed to 1460 periods, data from 1 January 2013; written by scripts/make_history_configs.py.
name: hist_favorita_lightgbm_4y
seed: 0
dataset:
  name: favorita
  params:
    start: '2013-01-01'
model:
  name: seed_average
  params:
    model: lightgbm_direct
    members: 5
    seed: 0
    params:
      horizon: 28
      train_periods: 1460
      group_by: store_id
      categorical:
      - item_id
      - class
      - family
      extra:
      - promo
      - event
      - payday
      rounds: 800
      threads: 16
      params:
        min_data_in_leaf: 800
        objective: poisson
        learning_rate: 0.025
evaluation:
  horizon: 28
  n_origins: 4
  scale_lag: 1
  weight_window: 28
  holdout_periods: 0
  step: 28
