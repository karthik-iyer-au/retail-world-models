# Study P (docs/PAPER1_REVISION_PLAN.md, entry of 1 November 2026): store totals forecast directly,
# settings of configs/experiments/avg5_dominicks_ana_rolling_lightgbm.yaml as its study O loop starts it; written by scripts/make_reconcile_configs.py.
name: agg_store_lightgbm_dominicks_ana
seed: 0
dataset:
  name: dominicks
  params:
    categories:
    - ana
  aggregate:
    by:
    - store_id
model:
  name: seed_average
  params:
    model: lightgbm_direct
    members: 5
    seed: 0
    params:
      horizon: 8
      train_periods: 156
      categorical:
      - item_id
      - store_id
      extra:
      - promo
      - cost
      lags:
      - 0
      - 1
      - 2
      - 4
      windows:
      - 4
      - 8
      - 13
      - 26
      spread_window: 13
      price_window: 12
      price_lag: 1
      rounds: 500
      threads: 16
      params:
        num_leaves: 63
        min_data_in_leaf: 50
evaluation:
  horizon: 8
  n_origins: 4
  holdout_periods: 72
  step: 8
  scale_lag: 1
  weight_window: 13
  after_promo:
    levers:
    - promo
    periods: 2
