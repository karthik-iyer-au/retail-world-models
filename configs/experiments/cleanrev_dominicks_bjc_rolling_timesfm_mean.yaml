# Dominick's comparison of all models rerun on cleaned prices (plan entry of 10 November 2026): rev_dominicks_bjc_rolling_timesfm_mean.yaml with clean_prices 5; written by hand from the rev configs.
name: cleanrev_dominicks_bjc_rolling_timesfm_mean
seed: 0
dataset:
  name: dominicks
  params:
    categories:
    - bjc
    clean_prices: 5
model:
  name: timesfm
  params:
    context: 512
    batch_size: 256
    point: mean
evaluation:
  horizon: 8
  n_origins: 6
  holdout_periods: 24
  scale_lag: 1
  weight_window: 13
  conditions:
  - promo
  after_promo:
    levers:
    - promo
    periods: 2
  step: 8
