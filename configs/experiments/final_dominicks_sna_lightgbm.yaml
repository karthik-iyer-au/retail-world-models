# Final run (plan entry of 10 November 2026): the tuned settings of dominicks_sna's lightgbm, from clean_avg5_lightgbm_dominicks_sna (kept: clean_avg5_lightgbm_dominicks_sna:rounds_double), on the paper's rolling windows; written by scripts/make_final_configs.py.
name: final_dominicks_sna_lightgbm
seed: 0
dataset:
  name: dominicks
  params:
    categories:
    - sna
    clean_prices: 5
model:
  name: seed_average
  params:
    model: lightgbm_direct
    members: 5
    seed: 0
    params:
      horizon: 8
      train_periods: 156
      categorical:
      - item_id
      - store_id
      extra:
      - promo
      - cost
      lags:
      - 0
      - 1
      - 2
      - 4
      windows:
      - 4
      - 8
      - 13
      - 26
      spread_window: 13
      price_window: 12
      price_lag: 1
      rounds: 1000
      threads: 16
      params:
        num_leaves: 63
        min_data_in_leaf: 50
evaluation:
  horizon: 8
  n_origins: 6
  holdout_periods: 24
  scale_lag: 1
  weight_window: 13
  conditions:
  - promo
  after_promo:
    levers:
    - promo
    periods: 2
  step: 8
