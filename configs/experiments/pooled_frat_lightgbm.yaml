# Study U part (b), pooled (plan entry of 11 November 2026); written by scripts/make_pooled_configs.py.
name: pooled_frat_lightgbm
seed: 0
dataset:
  name: breakfast_at_the_frat
model:
  name: seed_average
  params:
    model: pooled
    members: 5
    seed: 0
    params:
      model: lightgbm_direct
      params:
        horizon: 8
        train_periods: 90
        categorical:
        - item_id
        - store_id
        - cat_id
        - manufacturer
        - store_segment
        extra:
        - promo
        - display
        - feature
        - tpr_only
        - base_price
        lags:
        - 0
        - 1
        - 2
        - 4
        windows:
        - 4
        - 8
        - 13
        - 26
        spread_window: 13
        price_window: 12
        price_lag: 1
        rounds: 500
        threads: 16
        params:
          num_leaves: 63
          min_data_in_leaf: 50
          learning_rate: 0.1
      pool_with:
      - name: dominicks
        params:
          categories:
          - ana
          clean_prices: 5
        tag: dominicks_ana
      - name: dominicks
        params:
          categories:
          - bjc
          clean_prices: 5
        tag: dominicks_bjc
      - name: dominicks
        params:
          categories:
          - che
          clean_prices: 5
        tag: dominicks_che
      - name: dominicks
        params:
          categories:
          - fre
          clean_prices: 5
        tag: dominicks_fre
      - name: dominicks
        params:
          categories:
          - sdr
          clean_prices: 5
        tag: dominicks_sdr
      - name: dominicks
        params:
          categories:
          - sna
          clean_prices: 5
        tag: dominicks_sna
evaluation:
  horizon: 8
  n_origins: 4
  holdout_periods: 24
  scale_lag: 1
  weight_window: 13
  conditions:
  - promo
  - display
  - feature
  - tpr_only
  step: 8
