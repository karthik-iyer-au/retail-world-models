# Final test: Breakfast at the Frat, the last 8 weeks, the lift model with readout dropout and weight decay. Settings copied unchanged from the development config frat_dev_lift_dropout_decay.yaml;
# fixed before the run and not tuned on this window. Reported once.
name: frat_final_lift
seed: 0
dataset:
  name: breakfast_at_the_frat
model:
  name: state_model
  params:
    horizon: 8
    history: 26
    train_periods: 90
    categorical:
    - item_id
    - store_id
    - cat_id
    - manufacturer
    - store_segment
    extra:
    - promo
    - display
    - feature
    - tpr_only
    d_model: 64
    layers: 2
    heads: 4
    steps: 3000
    batch: 256
    lr: 0.001
    regular_price: true
    lift_readout: true
    readout_dropout: 0.2
    weight_decay: 0.01
    seed: 0
evaluation:
  horizon: 8
  n_origins: 1
  holdout_periods: 0
  scale_lag: 1
  weight_window: 13
  conditions:
  - promo
  - display
  - feature
  - tpr_only
