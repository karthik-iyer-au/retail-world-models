# Base of the 52-week search (written by scripts/make_long_horizon_specs.py)
name: h52s_dominicks_fre_lightgbm
seed: 0
dataset:
  name: dominicks
  params:
    categories:
    - fre
    clean_prices: 5
model:
  name: seed_average
  params:
    model: lightgbm_direct
    members: 1
    seed: 0
    params:
      horizon: 52
      train_periods: 156
      categorical:
      - item_id
      - store_id
      extra:
      - promo
      - cost
      lags:
      - 0
      - 1
      - 2
      - 4
      windows:
      - 4
      - 8
      - 13
      - 26
      spread_window: 13
      price_window: 12
      price_lag: 1
      rounds: 500
      threads: 16
      params:
        num_leaves: 252
        min_data_in_leaf: 50
evaluation:
  horizon: 52
  n_origins: 3
  holdout_periods: 102
  step: 13
  scale_lag: 1
  weight_window: 13
  after_promo:
    levers:
    - promo
    periods: 2
