# History-length test (plan entry of 15 November 2026): final_dominicks_sdr_lightgbm.yaml with only the training length changed to 260 periods; written by scripts/make_history_configs.py.
name: hist_dominicks_sdr_lightgbm_5y
seed: 0
dataset:
  name: dominicks
  params:
    categories:
    - sdr
    clean_prices: 5
model:
  name: seed_average
  params:
    model: lightgbm_direct
    members: 5
    seed: 0
    params:
      horizon: 8
      train_periods: 260
      categorical:
      - item_id
      - store_id
      extra:
      - promo
      - cost
      lags:
      - 0
      - 1
      - 2
      - 4
      windows:
      - 4
      - 8
      - 13
      - 26
      spread_window: 13
      price_window: 12
      price_lag: 1
      rounds: 500
      threads: 16
      params:
        num_leaves: 15
        min_data_in_leaf: 50
        max_bin: 255
evaluation:
  horizon: 8
  n_origins: 6
  holdout_periods: 24
  scale_lag: 1
  weight_window: 13
  conditions:
  - promo
  after_promo:
    levers:
    - promo
    periods: 2
  step: 8
