# Study C stage 2: the lift model with the stock term on the rolling windows; written by scripts/make_pantry_configs.py.
name: rev_dominicks_fre_rolling_lift_stock
seed: 0
dataset:
  name: dominicks
  params:
    categories:
    - fre
model:
  name: state_model
  params:
    horizon: 8
    history: 26
    train_periods: 156
    categorical:
    - item_id
    - store_id
    extra:
    - promo
    - cost
    levers:
    - promo
    d_model: 64
    layers: 2
    heads: 4
    steps: 6000
    batch: 512
    lr: 0.001
    regular_price: true
    lift_readout: true
    validation_periods: 8
    scale_window: 8
    switching:
    - store_id
    stock: true
evaluation:
  horizon: 8
  n_origins: 6
  holdout_periods: 24
  scale_lag: 1
  weight_window: 13
  conditions:
  - promo
  after_promo:
    levers:
    - promo
    periods: 2
  step: 8
