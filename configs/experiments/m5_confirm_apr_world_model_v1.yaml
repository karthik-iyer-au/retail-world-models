# Confirmation window 28 March to 24 April 2016: the last 28 days before the M5 test period are held out and not loaded.
# Settings copied unchanged from m5_validation_world_model_roll_norm.yaml. Not used for any choice. Plan in docs/PAPER_NOTES.md, 'Revised world model: plan'.
name: m5_confirm_apr_world_model_v1
seed: 0
dataset:
  name: m5
model:
  name: state_model
  params:
    horizon: 28
    history: 112
    train_periods: 730
    categorical:
    - item_id
    - dept_id
    - cat_id
    - store_id
    - state_id
    extra:
    - event
    - snap
    d_model: 128
    layers: 3
    heads: 4
    steps: 30000
    batch: 1024
    lr: 0.001
    seed: 0
    mixed_precision: true
    regular_price: true
    lift_readout: true
    rollout: true
    roll_norm: true
evaluation:
  horizon: 28
  n_origins: 1
  scale_lag: 1
  weight_window: 28
  holdout_periods: 28
