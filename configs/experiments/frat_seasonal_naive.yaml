# Seasonal naive on Breakfast at the Frat: three 8-week windows at the end of the data.
# Price, display, circular and price-cut flags for the forecast weeks are taken
# as planned in advance, which is how a merchant would use the forecast.
name: frat_seasonal_naive
seed: 0
dataset:
  name: breakfast_at_the_frat
model:
  name: seasonal_naive
  params: {season: 52}
evaluation:
  horizon: 8
  n_origins: 3
  scale_lag: 1
  weight_window: 13
  conditions: [promo, display, feature, tpr_only]
