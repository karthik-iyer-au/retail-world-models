# Study Q (plan entry of 1 November 2026): rev_frat_rolling_lightgbm as an average of 5 copies; written by scripts/make_research_specs.py.
name: avg5_frat_rolling_lightgbm
seed: 0
dataset:
  name: breakfast_at_the_frat
model:
  name: seed_average
  params:
    model: lightgbm_direct
    members: 5
    seed: 0
    params:
      horizon: 8
      train_periods: 90
      categorical:
      - item_id
      - store_id
      - cat_id
      - manufacturer
      - store_segment
      extra:
      - promo
      - display
      - feature
      - tpr_only
      - base_price
      lags:
      - 0
      - 1
      - 2
      - 4
      windows:
      - 4
      - 8
      - 13
      - 26
      spread_window: 13
      price_window: 12
      price_lag: 1
      rounds: 500
      threads: 16
      params:
        num_leaves: 63
        min_data_in_leaf: 50
evaluation:
  horizon: 8
  n_origins: 4
  holdout_periods: 24
  scale_lag: 1
  weight_window: 13
  conditions:
  - promo
  - display
  - feature
  - tpr_only
  step: 8
