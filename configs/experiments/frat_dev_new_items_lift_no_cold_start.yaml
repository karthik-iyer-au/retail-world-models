# New-item test: our lift model with no way to forecast a new item (forecast is zero).
dataset:
  name: breakfast_at_the_frat
evaluation:
  conditions:
  - promo
  - display
  - feature
  - tpr_only
  holdout_periods: 8
  horizon: 8
  n_origins: 2
  scale_lag: 1
  weight_window: 13
  new_items:
    share: 0.1
    seed: 0
model:
  name: state_model
  params:
    batch: 256
    categorical:
    - item_id
    - store_id
    - cat_id
    - manufacturer
    - store_segment
    d_model: 64
    extra:
    - promo
    - display
    - feature
    - tpr_only
    heads: 4
    history: 26
    horizon: 8
    layers: 2
    lift_readout: true
    lr: 0.001
    regular_price: true
    seed: 0
    steps: 3000
    train_periods: 90
name: frat_dev_new_items_lift_no_cold_start
seed: 0
