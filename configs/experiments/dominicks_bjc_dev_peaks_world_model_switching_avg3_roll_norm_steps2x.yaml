# Training-length check (change C) on a development window: dominicks_bjc_dev_peaks_world_model_switching_avg3_roll_norm.yaml unchanged except steps 12000 (twice the original).
# Dominick's development windows; the final test is not touched. Plan in docs/PAPER_NOTES.md, 'Revised world model: plan', step 4.
name: dominicks_bjc_dev_peaks_world_model_switching_avg3_roll_norm_steps2x
seed: 0
dataset:
  name: dominicks
  params:
    categories:
    - bjc
model:
  name: seed_average
  params:
    model: state_model
    members: 3
    seed: 0
    params:
      horizon: 8
      history: 26
      train_periods: 156
      categorical:
      - item_id
      - store_id
      extra:
      - promo
      - cost
      levers:
      - promo
      d_model: 64
      layers: 2
      heads: 4
      steps: 6000
      batch: 512
      lr: 0.001
      regular_price: true
      lift_readout: true
      rollout: true
      validation_periods: 8
      scale_window: 8
      switching:
      - store_id
      roll_norm: true
    steps: 12000
evaluation:
  horizon: 8
  n_origins: 2
  holdout_periods: 8
  scale_lag: 1
  weight_window: 13
  conditions:
  - promo
  after_promo:
    levers:
    - promo
    periods: 2
