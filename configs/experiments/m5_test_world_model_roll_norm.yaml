# Final test: the world model with normalisation on the official M5 test period (23 May to 19 June 2016). Settings copied unchanged from the development config m5_validation_world_model_roll_norm.yaml;
# fixed before the run and not tuned on this window. Reported once.
name: m5_test_world_model_roll_norm
seed: 0
dataset:
  name: m5
  params:
    include_test: true
model:
  name: state_model
  params:
    horizon: 28
    history: 112
    train_periods: 730
    categorical:
    - item_id
    - dept_id
    - cat_id
    - store_id
    - state_id
    extra:
    - event
    - snap
    d_model: 128
    layers: 3
    heads: 4
    steps: 30000
    batch: 1024
    lr: 0.001
    seed: 0
    mixed_precision: true
    regular_price: true
    lift_readout: true
    rollout: true
    roll_norm: true
evaluation:
  horizon: 28
  n_origins: 1
  scale_lag: 1
  weight_window: 28
