# Dominick's category cra, same settings as analgesics, development windows.
name: dominicks_cra_dev_lift
seed: 0
dataset:
  name: dominicks
  params:
    categories:
    - cra
model:
  name: state_model
  params:
    horizon: 8
    history: 26
    train_periods: 156
    categorical:
    - item_id
    - store_id
    extra:
    - promo
    - cost
    levers:
    - promo
    d_model: 64
    layers: 2
    heads: 4
    steps: 6000
    batch: 512
    lr: 0.001
    regular_price: true
    lift_readout: true
    seed: 0
evaluation:
  horizon: 8
  n_origins: 2
  holdout_periods: 8
  scale_lag: 1
  weight_window: 13
  conditions:
  - promo
