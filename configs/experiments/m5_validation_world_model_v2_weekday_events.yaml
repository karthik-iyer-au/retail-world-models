# Revised world model, changes A and B: weekday inputs and the M5 events by kind.
# M5 practice window, seed 1. Plan in docs/PAPER_NOTES.md, 'Revised world model: plan'.
dataset:
  name: m5
evaluation:
  horizon: 28
  n_origins: 1
  scale_lag: 1
  weight_window: 28
model:
  name: state_model
  params:
    batch: 1024
    categorical:
    - item_id
    - dept_id
    - cat_id
    - store_id
    - state_id
    d_model: 128
    extra:
    - event
    - snap
    - event_national
    - event_religious
    - event_cultural
    - event_sporting
    heads: 4
    history: 112
    horizon: 28
    layers: 3
    lift_readout: true
    lr: 0.001
    mixed_precision: true
    regular_price: true
    roll_norm: true
    rollout: true
    seed: 1
    steps: 30000
    train_periods: 730
    weekday_flags: true
name: m5_validation_world_model_v2_weekday_events
seed: 1
