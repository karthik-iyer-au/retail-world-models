# The lift model with recorded base price, the US seasonal calendar and crowding together.
# Breakfast at the Frat development windows.
name: frat_dev_state_model_lift_merchant_inputs
seed: 0
dataset:
  name: breakfast_at_the_frat
  calendar: {country: US, anchor: end}
  crowding:
    levers: [display, feature, tpr_only]
    within: cat_id
model:
  name: state_model
  params:
    horizon: 8
    history: 26
    train_periods: 90
    categorical: [item_id, store_id, cat_id, manufacturer, store_segment]
    extra: [promo, display, feature, tpr_only, ev_new_year, pre_new_year, ev_super_bowl, pre_super_bowl,
      ev_valentines, pre_valentines, ev_easter, pre_easter, ev_mothers_day, pre_mothers_day, ev_memorial_day,
      pre_memorial_day, ev_july_4, pre_july_4, ev_labor_day, pre_labor_day, ev_halloween, pre_halloween,
      ev_thanksgiving, pre_thanksgiving, ev_christmas, pre_christmas, display_share, feature_share, tpr_only_share,
      display_share_within, feature_share_within, tpr_only_share_within]
    d_model: 64
    layers: 2
    heads: 4
    steps: 3000
    batch: 256
    lr: 0.001
    regular_price: true
    lift_readout: true
    levers: [promo, display, feature, tpr_only]
    regular_column: base_price
    seed: 0
evaluation:
  horizon: 8
  n_origins: 2
  holdout_periods: 8
  scale_lag: 1
  weight_window: 13
  conditions: [promo, display, feature, tpr_only]
