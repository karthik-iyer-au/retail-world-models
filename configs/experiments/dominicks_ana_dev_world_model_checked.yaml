# World model with the latent check, the collapse penalty and near weeks weighted more (no plan split).
name: dominicks_ana_dev_world_model_checked
seed: 0
dataset:
  name: dominicks
  params:
    categories:
    - ana
model:
  name: state_model
  params:
    horizon: 8
    history: 26
    train_periods: 156
    categorical:
    - item_id
    - store_id
    extra:
    - promo
    - cost
    levers:
    - promo
    d_model: 64
    layers: 2
    heads: 4
    steps: 6000
    batch: 512
    lr: 0.001
    regular_price: true
    lift_readout: true
    rollout: true
    validation_periods: 8
    seed: 0
    latent_weight: 0.5
    state_spread_weight: 0.1
    rollout_discount: 0.8
evaluation:
  horizon: 8
  n_origins: 2
  holdout_periods: 8
  scale_lag: 1
  weight_window: 13
  conditions:
  - promo
