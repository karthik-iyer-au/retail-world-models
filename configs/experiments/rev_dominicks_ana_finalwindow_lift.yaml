# Paper 1 revision, the final window, a model not run there before; settings as dominicks_ana's rolling config.
name: rev_dominicks_ana_finalwindow_lift
seed: 0
dataset:
  name: dominicks
  params:
    categories:
    - ana
model:
  name: state_model
  params:
    horizon: 8
    history: 26
    train_periods: 156
    categorical:
    - item_id
    - store_id
    extra:
    - promo
    - cost
    levers:
    - promo
    d_model: 64
    layers: 2
    heads: 4
    steps: 6000
    batch: 512
    lr: 0.001
    regular_price: true
    lift_readout: true
    validation_periods: 8
    scale_window: 8
    switching:
    - store_id
evaluation:
  horizon: 8
  n_origins: 1
  holdout_periods: 0
  scale_lag: 1
  weight_window: 13
  conditions:
  - promo
  after_promo:
    levers:
    - promo
    periods: 2
