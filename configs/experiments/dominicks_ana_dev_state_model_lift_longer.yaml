# The lift model trained for 24,000 steps (about two passes over the data) instead of 6,000.
# Dominick's analgesics development windows.
name: dominicks_ana_dev_state_model_lift_longer
seed: 0
dataset:
  name: dominicks
  params:
    categories: [ana]
model:
  name: state_model
  params:
    horizon: 8
    history: 26
    train_periods: 156
    categorical: [item_id, store_id]
    extra: [promo, cost]
    levers: [promo]
    d_model: 64
    layers: 2
    heads: 4
    steps: 24000
    batch: 512
    lr: 0.001
    regular_price: true
    lift_readout: true
    seed: 0
evaluation:
  horizon: 8
  n_origins: 2
  holdout_periods: 8
  scale_lag: 1
  weight_window: 13
  conditions: [promo]
