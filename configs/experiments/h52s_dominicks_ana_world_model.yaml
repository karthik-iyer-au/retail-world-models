# Base of the 52-week search (written by scripts/make_long_horizon_specs.py)
name: h52s_dominicks_ana_world_model
seed: 0
dataset:
  name: dominicks
  params:
    categories:
    - ana
    clean_prices: 5
model:
  name: seed_average
  params:
    model: state_model
    members: 1
    seed: 0
    params:
      horizon: 52
      history: 26
      train_periods: 156
      categorical:
      - item_id
      - store_id
      extra:
      - promo
      - cost
      levers:
      - promo
      d_model: 64
      layers: 2
      heads: 4
      steps: 6000
      batch: 512
      lr: 0.001
      regular_price: true
      lift_readout: true
      rollout: true
      validation_periods: 52
      scale_window: 8
      switching:
      - store_id
      roll_norm: true
      weight_average: 0.999
evaluation:
  horizon: 52
  n_origins: 3
  holdout_periods: 102
  step: 13
  scale_lag: 1
  weight_window: 13
  after_promo:
    levers:
    - promo
    periods: 2
