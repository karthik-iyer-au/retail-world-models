# Our model (item encoder and sales readout) on Breakfast at the Frat.
# The final 8 weeks are held out for the final test; this run scores the two
# 8-week windows before them. LightGBM with all levers averages 0.418 on these.
name: frat_dev_state_model
seed: 0
dataset:
  name: breakfast_at_the_frat
model:
  name: state_model
  params:
    horizon: 8
    history: 26
    train_periods: 90
    categorical: [item_id, store_id, cat_id, manufacturer, store_segment]
    extra: [promo, display, feature, tpr_only]
    d_model: 64
    layers: 2
    heads: 4
    steps: 3000
    batch: 256
    lr: 0.001
    seed: 0
evaluation:
  horizon: 8
  n_origins: 2
  holdout_periods: 8
  scale_lag: 1
  weight_window: 13
  conditions: [promo, display, feature, tpr_only]
