# TimesFM 2.5 with the plan: its own covariate method ("xreg + timesfm"), mean output, the plan inputs
# event and SNAP days and price against the highest price in the context window. A comparison added after the final tests.
# Dataset and evaluation copied unchanged from m5_confirm_mar_timesfm_mean.yaml. Settings fixed before any run.
name: m5_confirm_mar_timesfm_plan
seed: 0
dataset:
  name: m5
model:
  name: timesfm
  params:
    context: 512
    batch_size: 256
    point: mean
    plan:
    - event
    - snap
    price_plan: true
    ridge: 1.0
evaluation:
  horizon: 28
  n_origins: 1
  scale_lag: 1
  weight_window: 28
  holdout_periods: 56
