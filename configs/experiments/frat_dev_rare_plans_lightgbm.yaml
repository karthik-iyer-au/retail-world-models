# Unusual-plan test: accuracy on lever mixes that were under 2% of training rows.
name: frat_dev_rare_plans_lightgbm
seed: 0
dataset:
  name: breakfast_at_the_frat
model:
  name: lightgbm_direct
  params:
    horizon: 8
    train_periods: 90
    categorical:
    - item_id
    - store_id
    - cat_id
    - manufacturer
    - store_segment
    extra:
    - promo
    - display
    - feature
    - tpr_only
    - base_price
    lags:
    - 0
    - 1
    - 2
    - 4
    windows:
    - 4
    - 8
    - 13
    - 26
    spread_window: 13
    price_window: 12
    price_lag: 1
    rounds: 500
    seed: 0
    threads: 2
    params:
      num_leaves: 63
      min_data_in_leaf: 50
evaluation:
  horizon: 8
  n_origins: 2
  holdout_periods: 8
  scale_lag: 1
  weight_window: 13
  conditions:
  - promo
  - display
  - feature
  - tpr_only
  rare_plans:
    levers:
    - display
    - feature
    - tpr_only
    below: 0.02
