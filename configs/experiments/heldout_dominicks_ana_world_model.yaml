# Held-out periods scored (plan entry of 15 November 2026): final_dominicks_ana_world_model.yaml with only the windows changed; written by scripts/make_heldout_configs.py.
name: heldout_dominicks_ana_world_model
seed: 0
dataset:
  name: dominicks
  params:
    categories:
    - ana
    clean_prices: 5
model:
  name: seed_average
  params:
    model: state_model
    members: 5
    seed: 0
    params:
      horizon: 8
      history: 26
      train_periods: 156
      categorical:
      - item_id
      - store_id
      extra:
      - promo
      - cost
      levers:
      - promo
      d_model: 64
      layers: 2
      heads: 4
      steps: 6000
      batch: 512
      lr: 0.001
      regular_price: true
      lift_readout: true
      rollout: true
      validation_periods: 8
      scale_window: 8
      switching:
      - store_id
      roll_norm: true
      weight_average: 0.999
evaluation:
  horizon: 8
  n_origins: 3
  holdout_periods: 0
  scale_lag: 1
  weight_window: 13
  conditions:
  - promo
  after_promo:
    levers:
    - promo
    periods: 2
  step: 8
