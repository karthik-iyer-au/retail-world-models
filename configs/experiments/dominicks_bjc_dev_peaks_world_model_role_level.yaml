# Dominick's bjc: world model with the item role as a label and picking the level: 4 weeks for in-and-out items, 8 for promotion-driven and new items, 26 for the rest. Roles are measured before the test windows.
name: dominicks_bjc_dev_peaks_world_model_role_level
seed: 0
dataset:
  name: dominicks
  params:
    categories:
    - bjc
  roles:
    lever: promo
model:
  name: state_model
  params:
    horizon: 8
    history: 26
    train_periods: 156
    categorical:
    - item_id
    - store_id
    - item_role
    extra:
    - promo
    - cost
    levers:
    - promo
    d_model: 64
    layers: 2
    heads: 4
    steps: 6000
    batch: 512
    lr: 0.001
    regular_price: true
    lift_readout: true
    rollout: true
    validation_periods: 8
    seed: 0
    scale_window_by:
      label: item_role
      windows:
        in_and_out: 4
        promotion_driven: 8
        new: 8
evaluation:
  horizon: 8
  n_origins: 2
  holdout_periods: 8
  scale_lag: 1
  weight_window: 13
  conditions:
  - promo
  after_promo:
    levers:
    - promo
    periods: 2
