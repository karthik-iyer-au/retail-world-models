# Dominick's comparison of all models rerun on cleaned prices (plan entry of 10 November 2026): rev_dominicks_fre_rolling_world_model.yaml with clean_prices 5; written by hand from the rev configs.
name: cleanrev_dominicks_fre_rolling_world_model
seed: 0
dataset:
  name: dominicks
  params:
    categories:
    - fre
    clean_prices: 5
model:
  name: state_model
  params:
    horizon: 8
    history: 26
    train_periods: 156
    categorical:
    - item_id
    - store_id
    extra:
    - promo
    - cost
    levers:
    - promo
    d_model: 64
    layers: 2
    heads: 4
    steps: 6000
    batch: 512
    lr: 0.001
    regular_price: true
    lift_readout: true
    rollout: true
    validation_periods: 8
    scale_window: 8
    switching:
    - store_id
    roll_norm: true
evaluation:
  horizon: 8
  n_origins: 6
  holdout_periods: 24
  scale_lag: 1
  weight_window: 13
  conditions:
  - promo
  after_promo:
    levers:
    - promo
    periods: 2
  step: 8
