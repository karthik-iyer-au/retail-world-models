# Final run (plan entry of 10 November 2026): the tuned settings of m5's world model, from hybridU_pure_m5 (kept: pure_m5:feedback, lossT_pure_m5:hurdle_nb_item_spread), on the paper's rolling windows; written by scripts/make_final_configs.py.
name: final_m5_world_model
seed: 0
dataset:
  name: m5
model:
  name: state_model
  params:
    horizon: 28
    history: 112
    train_periods: 730
    categorical:
    - item_id
    - dept_id
    - cat_id
    - store_id
    - state_id
    extra:
    - event
    - snap
    d_model: 128
    layers: 3
    heads: 4
    steps: 30000
    batch: 1024
    lr: 0.001
    seed: 0
    mixed_precision: true
    regular_price: true
    lift_readout: true
    rollout: true
    roll_norm: true
    feedback: true
    likelihood: hurdle_nb
    spread_by_item: true
evaluation:
  horizon: 28
  n_origins: 4
  scale_lag: 1
  weight_window: 28
  holdout_periods: 84
  step: 28
