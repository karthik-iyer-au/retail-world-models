# Dominick's category che: world model, 8-week level, as the seasonal run, with the loss weighted by dollar sales.
dataset:
  name: dominicks
  params:
    categories:
    - che
  calendar:
    country: US
    anchor: start
    after: 4
  season: true
evaluation:
  conditions:
  - promo
  holdout_periods: 8
  horizon: 8
  n_origins: 2
  scale_lag: 1
  weight_window: 13
model:
  name: state_model
  params:
    batch: 512
    categorical:
    - item_id
    - store_id
    d_model: 64
    extra:
    - promo
    - cost
    - season_sin1
    - season_cos1
    - season_sin2
    - season_cos2
    - ev_christmas
    - pre_christmas
    - post1_christmas
    - post2_christmas
    - post3_christmas
    - post4_christmas
    - ev_easter
    - pre_easter
    - post1_easter
    - post2_easter
    - post3_easter
    - post4_easter
    - ev_halloween
    - pre_halloween
    - post1_halloween
    - post2_halloween
    - post3_halloween
    - post4_halloween
    - ev_july_4
    - pre_july_4
    - post1_july_4
    - post2_july_4
    - post3_july_4
    - post4_july_4
    - ev_labor_day
    - pre_labor_day
    - post1_labor_day
    - post2_labor_day
    - post3_labor_day
    - post4_labor_day
    - ev_memorial_day
    - pre_memorial_day
    - post1_memorial_day
    - post2_memorial_day
    - post3_memorial_day
    - post4_memorial_day
    - ev_mothers_day
    - pre_mothers_day
    - post1_mothers_day
    - post2_mothers_day
    - post3_mothers_day
    - post4_mothers_day
    - ev_new_year
    - pre_new_year
    - post1_new_year
    - post2_new_year
    - post3_new_year
    - post4_new_year
    - ev_super_bowl
    - pre_super_bowl
    - post1_super_bowl
    - post2_super_bowl
    - post3_super_bowl
    - post4_super_bowl
    - ev_thanksgiving
    - pre_thanksgiving
    - post1_thanksgiving
    - post2_thanksgiving
    - post3_thanksgiving
    - post4_thanksgiving
    - ev_valentines
    - pre_valentines
    - post1_valentines
    - post2_valentines
    - post3_valentines
    - post4_valentines
    heads: 4
    history: 26
    horizon: 8
    layers: 2
    levers:
    - promo
    lift_readout: true
    lr: 0.001
    regular_price: true
    rollout: true
    scale_window: 8
    seed: 0
    steps: 6000
    train_periods: 330
    validation_periods: 8
    volume_weight: 0.9
    volume_by: dollars
    tweedie_power: 1.1
name: dominicks_che_dev_world_model_level8_long_seasonal_dollars
seed: 0
