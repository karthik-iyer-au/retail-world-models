# Study T (docs/PAPER1_REVISION_PLAN.md, entry of 4 November 2026): one round of count likelihoods on top of
# the final settings of pure_m5; written by scripts/make_loss_round.py. Run with one round.
name: lossT_pure_m5
base: configs/experiments/lossT_pure_m5.yaml
evaluation:
  horizon: 28
  n_origins: 4
  holdout_periods: 196
  step: 28
  scale_lag: 1
  weight_window: 28
seeds:
- 1
- 2
- 3
rung_fraction: 1.0
promote: beats_best
menu:
- name: negative_binomial
  change:
    likelihood: negative_binomial
- name: negative_binomial_item_spread
  change:
    likelihood: negative_binomial
    spread_by_item: true
- name: zinb_item_spread
  change:
    likelihood: zinb
    spread_by_item: true
- name: hurdle_nb_item_spread
  change:
    likelihood: hurdle_nb
    spread_by_item: true
