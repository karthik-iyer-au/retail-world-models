# Study M (docs/PAPER1_REVISION_PLAN.md, entry of 28 October 2026): the research loop
# (src/rwm/research/loop.py) as the companion work ran it. Fixed before the first try and
# never changed by the loop. Every change is tried alone on top of the best settings so far,
# at full training length on seed 1; a change that beats the best on seed 1 is run on seeds
# 2 and 3, and the best such change is kept if its mean over the three seeds beats the best's
# mean by at least the seed spread of the starting settings. The windows lie before every
# window the paper reports; the latest of the four is held out, scored but never used to decide.
# Written by scripts/make_research_specs.py.
name: pure_m5
base: configs/experiments/rev_m5_rolling_world_model.yaml
evaluation:
  horizon: 28
  n_origins: 4
  holdout_periods: 196
  step: 28
  scale_lag: 1
  weight_window: 28
seeds:
- 1
- 2
- 3
rung_fraction: 1.0
promote: beats_best
menu:
- name: volume_weight_0.25
  change:
    volume_weight: 0.25
- name: volume_weight_0.5
  change:
    volume_weight: 0.5
- name: peak_weight_0.5
  change:
    peak_weight: 0.5
- name: after_promo_weight_0.5
  change:
    after_promo_weight: 0.5
- name: total_weight_0.1
  change:
    total_weight: 0.1
- name: plan_split
  change:
    plan_split: true
- name: feedback
  change:
    feedback: true
- name: level_views
  change:
    level_views:
    - 7
    - 28
- name: latent_check
  change:
    latent_weight: 0.1
- name: latent_overshooting
  change:
    latent_weight: 0.1
    latent_checks: 7
- name: state_spread
  change:
    state_spread_weight: 0.01
- name: lr_half
  change:
    lr: 0.0005
- name: lr_double
  change:
    lr: 0.002
- name: batch_half
  change:
    batch: 512
- name: steps_1.5x
  change:
    steps: 45000
- name: weight_average_0.999
  change:
    weight_average: 0.999
- name: width_1.5x
  change:
    d_model: 192
- name: adajepa_1
  change:
    adapt_steps: 1
    adapt_optimizer: adam
    adapt_lr: 0.0001
    adapt_periods: 28
- name: adajepa_3
  change:
    adapt_steps: 3
    adapt_optimizer: adam
    adapt_lr: 0.0001
    adapt_periods: 28
