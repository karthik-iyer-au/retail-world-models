# Study N (docs/PAPER1_REVISION_PLAN.md, entry of 29 October 2026), on LightGBM: the research loop
# (src/rwm/research/loop.py) as the companion work ran it. Fixed before the first try and
# never changed by the loop. Every change is tried alone on top of the best settings so far,
# at full training length on seed 1; a change that beats the best on seed 1 is run on seeds
# 2 and 3, and the best such change is kept if its mean over the three seeds beats the best's
# mean by at least the seed spread of the starting settings. The windows lie before every
# window the paper reports; the latest of the four is held out, scored but never used to decide.
# Written by scripts/make_research_specs.py.
name: pure_lightgbm_dominicks_sdr
base: configs/experiments/rev_dominicks_sdr_rolling_lightgbm.yaml
evaluation:
  horizon: 8
  n_origins: 4
  holdout_periods: 72
  step: 8
  scale_lag: 1
  weight_window: 13
  after_promo:
    levers:
    - promo
    periods: 2
seeds:
- 1
- 2
- 3
rung_fraction: 1.0
promote: beats_best
base_overrides:
  threads: 16
menu:
- name: rounds_half
  change:
    rounds: 250
- name: rounds_1.5x
  change:
    rounds: 750
- name: rounds_double
  change:
    rounds: 1000
- name: learning_rate_half
  change:
    params:
      learning_rate: 0.025
- name: learning_rate_double
  change:
    params:
      learning_rate: 0.1
- name: num_leaves_quarter
  change:
    params:
      num_leaves: 15
- name: num_leaves_4x
  change:
    params:
      num_leaves: 252
- name: min_data_in_leaf_quarter
  change:
    params:
      min_data_in_leaf: 12
- name: min_data_in_leaf_4x
  change:
    params:
      min_data_in_leaf: 200
- name: feature_fraction_0.8
  change:
    params:
      feature_fraction: 0.8
- name: bagging_fraction_0.8
  change:
    params:
      bagging_fraction: 0.8
- name: tweedie_power_1.3
  change:
    params:
      tweedie_variance_power: 1.3
- name: tweedie_power_1.5
  change:
    params:
      tweedie_variance_power: 1.5
- name: l2_1
  change:
    params:
      lambda_l2: 1.0
- name: max_bin_255
  change:
    params:
      max_bin: 255
- name: more_lags
  change:
    lags:
    - 0
    - 1
    - 2
    - 4
    - 5
    - 6
- name: longer_windows
  change:
    windows:
    - 4
    - 8
    - 13
    - 26
    - 52
- name: train_periods_half
  change:
    train_periods: 78
- name: objective_poisson
  change:
    params:
      objective: poisson
- name: seed_bagging_off
  change:
    params:
      bagging_fraction: 1.0
      bagging_freq: 0
