# Study U part (a) (docs/PAPER1_REVISION_PLAN.md, entry of 9 November 2026): JEPA pretraining and
# hybrid fine-tuning on top of the final settings of clean_avg5_world_model_dominicks_ana; written by scripts/make_hybrid_round.py.
# Run with one round.
name: hybridU_clean_avg5_world_model_dominicks_ana
base: configs/experiments/hybridU_clean_avg5_world_model_dominicks_ana.yaml
evaluation:
  horizon: 8
  n_origins: 4
  holdout_periods: 72
  step: 8
  scale_lag: 1
  weight_window: 13
  after_promo:
    levers:
    - promo
    periods: 2
seeds:
- 1
- 2
- 3
rung_fraction: 1.0
promote: beats_best
menu:
- name: jepa_hybrid
  change:
    params:
      finetune: low_lr
      encoder_lr_scale: 0.1
      latent_weight: 0.5
      pretrain_steps: 6000
- name: jepa_hybrid_long
  change:
    params:
      finetune: low_lr
      encoder_lr_scale: 0.1
      latent_weight: 0.5
      pretrain_steps: 18000
