# Tuning for 52 weeks (docs/PAPER1_REVISION_PLAN.md, entry of 14 November 2026): the research loop
# (src/rwm/research/loop.py) as the paper's searches ran it, with the same menu, from the final tuned settings,
# the model fitted to forecast all 52 weeks at once, one copy. Fixed before the first try and never changed by the
# loop. Every change is tried alone on top of the best settings so far on seed 1; a change that beats the best on
# seed 1 is run on seeds 2 and 3, and the best such change is kept if its mean over the three seeds beats the best's
# mean by at least the seed spread of the starting settings. Three windows of 52 weeks, all before the 52-week
# test's windows; the latest is held out, scored but never used to decide. At most three rounds.
# Written by scripts/make_long_horizon_specs.py.
name: h52s_lightgbm_dominicks_sdr
base: configs/experiments/h52s_dominicks_sdr_lightgbm.yaml
evaluation:
  horizon: 52
  n_origins: 3
  holdout_periods: 102
  step: 13
  scale_lag: 1
  weight_window: 13
  after_promo:
    levers:
    - promo
    periods: 2
seeds:
- 1
- 2
- 3
rung_fraction: 1.0
promote: beats_best
menu:
- name: rounds_half
  change:
    params:
      rounds: 250
- name: rounds_1.5x
  change:
    params:
      rounds: 750
- name: rounds_double
  change:
    params:
      rounds: 1000
- name: learning_rate_half
  change:
    params:
      params:
        learning_rate: 0.025
- name: learning_rate_double
  change:
    params:
      params:
        learning_rate: 0.1
- name: num_leaves_quarter
  change:
    params:
      params:
        num_leaves: 15
- name: num_leaves_4x
  change:
    params:
      params:
        num_leaves: 60
- name: min_data_in_leaf_quarter
  change:
    params:
      params:
        min_data_in_leaf: 12
- name: min_data_in_leaf_4x
  change:
    params:
      params:
        min_data_in_leaf: 200
- name: feature_fraction_0.8
  change:
    params:
      params:
        feature_fraction: 0.8
- name: bagging_fraction_0.8
  change:
    params:
      params:
        bagging_fraction: 0.8
- name: tweedie_power_1.3
  change:
    params:
      params:
        tweedie_variance_power: 1.3
- name: tweedie_power_1.5
  change:
    params:
      params:
        tweedie_variance_power: 1.5
- name: l2_1
  change:
    params:
      params:
        lambda_l2: 1.0
- name: max_bin_255
  change:
    params:
      params:
        max_bin: 255
- name: more_lags
  change:
    params:
      lags:
      - 0
      - 1
      - 2
      - 4
      - 5
      - 6
- name: longer_windows
  change:
    params:
      windows:
      - 4
      - 8
      - 13
      - 26
      - 52
- name: train_periods_half
  change:
    params:
      train_periods: 78
- name: objective_poisson
  change:
    params:
      params:
        objective: poisson
- name: seed_bagging_off
  change:
    params:
      params:
        bagging_fraction: 1.0
        bagging_freq: 0
base_overrides:
  params:
    threads: 16
