# TimesFM 2.5 zero-shot on all four M5 windows with its mean output as the forecast.
# The first TimesFM job used its median, which sits below the mean for items that often sell nothing in a day.
datasets:
- name: m5
runs:
- config: configs/experiments/m5_confirm_mar_timesfm_mean.yaml
  seeds: [1]
- config: configs/experiments/m5_confirm_apr_timesfm_mean.yaml
  seeds: [1]
- config: configs/experiments/m5_validation_timesfm_mean.yaml
  seeds: [1]
- config: configs/experiments/m5_test_timesfm_mean.yaml
  seeds: [1]
