  - 1
- config: configs/experiments/dominicks_bjc_dev_world_model_level8_units_loss.yaml
  seeds:
  - 1
- config: configs/experiments/dominicks_cig_dev_world_model_level8_units_loss.yaml
  seeds:
  - 1
- config: configs/experiments/dominicks_che_dev_world_model_level8_units_loss.yaml
  seeds:
  - 1
- config: configs/experiments/dominicks_ana_dev_world_model_level8_units_loss.yaml
