# The training fixes and the world model on Dominick's analgesics.
datasets:
  - name: dominicks
    codes: [ana]
runs:
  - config: configs/experiments/dominicks_ana_dev_lift_validation_stop.yaml
    seeds: [1, 2, 3]
  - config: configs/experiments/dominicks_ana_dev_lift_totals_loss.yaml
    seeds: [1, 2, 3]
  - config: configs/experiments/dominicks_ana_dev_lift_fixes_long.yaml
    seeds: [1, 2, 3]
  - config: configs/experiments/dominicks_ana_dev_world_model_fixes.yaml
    seeds: [1, 2, 3]
  - config: configs/experiments/dominicks_ana_dev_world_model_best_recipe_fixes.yaml
    seeds: [1, 2, 3]
