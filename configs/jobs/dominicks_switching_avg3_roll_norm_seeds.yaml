  - 2
  - 3
- config: configs/experiments/dominicks_sdr_dev_peaks_world_model_switching_avg3_roll_norm.yaml
  seeds:
  - 2
  - 3
- config: configs/experiments/dominicks_bjc_dev_peaks_world_model_switching_avg3_roll_norm.yaml
  seeds:
  - 2
  - 3
- config: configs/experiments/dominicks_ana_dev_peaks_world_model_switching_avg3_roll_norm.yaml
  seeds:
  - 2
  - 3
- config: configs/experiments/dominicks_fre_dev_peaks_world_model_switching_avg3_roll_norm.yaml
