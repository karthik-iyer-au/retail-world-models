# Seeds 2 and 3 of the averaged world model with brand switching and normalised roll-forward, six Dominick's categories, so the averaged version also has a spread across seeds.
datasets:
- name: dominicks
  codes:
  - che
  - sna
  - sdr
  - bjc
  - ana
  - fre
runs:
- config: configs/experiments/dominicks_che_dev_peaks_world_model_switching_avg3_roll_norm.yaml
