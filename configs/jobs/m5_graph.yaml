# Graph model over product attributes on all four M5 windows, three seeds each. Settings fixed before any run.
datasets:
- name: m5
runs:
- config: configs/experiments/m5_validation_graph.yaml
  seeds: &seeds [1, 2, 3]
- config: configs/experiments/m5_confirm_mar_graph.yaml
  seeds: *seeds
- config: configs/experiments/m5_confirm_apr_graph.yaml
  seeds: *seeds
- config: configs/experiments/m5_test_graph.yaml
  seeds: *seeds
