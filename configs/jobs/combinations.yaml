# Our lift model combined with LightGBM, on both weekly datasets.
datasets:
  - name: breakfast_at_the_frat
    from: /content/drive/MyDrive/retail-world-model/data
  - name: dominicks
    codes: [ana]
runs:
  - config: configs/experiments/frat_dev_combination_lift_lightgbm.yaml
    seeds: [1, 2, 3, 4, 5]
  - config: configs/experiments/dominicks_ana_dev_combination_lift_lightgbm.yaml
    seeds: [1, 2, 3]
