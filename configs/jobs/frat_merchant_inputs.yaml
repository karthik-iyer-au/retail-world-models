# Recorded base price, seasonal calendar and crowding, one at a time and
# together, for our lift model; and the calendar and crowding for LightGBM.
# Breakfast at the Frat development windows, five seeds each.
datasets:
  - name: breakfast_at_the_frat
    from: /content/drive/MyDrive/retail-world-model/data
runs:
  - config: configs/experiments/frat_dev_lightgbm_merchant_inputs.yaml
    seeds: [1, 2, 3, 4, 5]
  - config: configs/experiments/frat_dev_state_model_lift_base_price.yaml
    seeds: [1, 2, 3, 4, 5]
  - config: configs/experiments/frat_dev_state_model_lift_calendar.yaml
    seeds: [1, 2, 3, 4, 5]
  - config: configs/experiments/frat_dev_state_model_lift_crowding.yaml
    seeds: [1, 2, 3, 4, 5]
  - config: configs/experiments/frat_dev_state_model_lift_merchant_inputs.yaml
    seeds: [1, 2, 3, 4, 5]
