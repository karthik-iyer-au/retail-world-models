# The model given both a recent and a longer level and left to learn which to trust. Ten Dominick's categories: six from the peaks job, plus four where the fixed 8-week level made things worse (cig, tpa, ber, did).
datasets:
- name: dominicks
  codes:
  - che
  - sna
  - sdr
  - bjc
  - ana
  - fre
  - cig
  - tpa
  - ber
  - did
runs:
- config: configs/experiments/dominicks_che_dev_peaks_level_views.yaml
  seeds:
  - 1
- config: configs/experiments/dominicks_sna_dev_peaks_level_views.yaml
  seeds:
  - 1
- config: configs/experiments/dominicks_sdr_dev_peaks_level_views.yaml
  seeds:
  - 1
- config: configs/experiments/dominicks_bjc_dev_peaks_level_views.yaml
  seeds:
  - 1
- config: configs/experiments/dominicks_ana_dev_peaks_level_views.yaml
  seeds:
  - 1
- config: configs/experiments/dominicks_fre_dev_peaks_level_views.yaml
  seeds:
  - 1
- config: configs/experiments/dominicks_cig_dev_peaks_level_views.yaml
  seeds:
  - 1
- config: configs/experiments/dominicks_tpa_dev_peaks_level_views.yaml
  seeds:
  - 1
- config: configs/experiments/dominicks_ber_dev_peaks_level_views.yaml
  seeds:
  - 1
- config: configs/experiments/dominicks_did_dev_peaks_level_views.yaml
  seeds:
  - 1
